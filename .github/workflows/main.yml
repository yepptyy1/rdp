name: Windows-AnyDesk-PC
on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Setup User
      run: |
        $Password = ConvertTo-SecureString "MyRobloxBot123!" -AsPlainText -Force
        Set-LocalUser -Name "runneradmin" -Password $Password

    - name: Install AnyDesk
      run: |
        # Download and Install AnyDesk
        curl -L -o AnyDesk.exe https://download.anydesk.com/AnyDesk.exe
        Start-Process ./AnyDesk.exe -ArgumentList "--install C:\AnyDesk --start-with-win --silent" -Wait
        
        # Set the login password
        echo MyRobloxBot123! | C:\AnyDesk\AnyDesk.exe --set-password
        
        # Start the service and app
        net start "AnyDesk"
        Start-Process "C:\AnyDesk\AnyDesk.exe"
        Start-Sleep -Seconds 10

    - name: Get AnyDesk ID
      run: |
        Write-Host "--- FETCHING YOUR ID ---"
        # Force the ID to print clearly in the log
        $anydesk_id = & "C:\AnyDesk\AnyDesk.exe" --get-id
        Write-Host "*****************************"
        Write-Host "YOUR ANYDESK ID: $anydesk_id"
        Write-Host "*****************************"

    - name: Keep Alive
      run: |
        Write-Host "AnyDesk is running. Connect using the ID above."
        while($true) { Start-Sleep -Seconds 3600 }
