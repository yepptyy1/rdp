name: Windows-RDP-Direct-Browser
on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Setup User
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        $Password = ConvertTo-SecureString "MyRobloxBot123!" -AsPlainText -Force
        Set-LocalUser -Name "runneradmin" -Password $Password

    - name: Start Browser-Based RDP
      run: |
        # Download Cloudflare
        curl -L -o cloudflared.exe https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe
        
        Write-Host "--- Copy the .trycloudflare.com link below ---"
        Write-Host "--- Paste it into Chrome or Edge to see your PC! ---"
        
        # This command tells Cloudflare to serve the RDP over HTTP (Browser)
        .\cloudflared.exe tunnel --url http://localhost:3389
